# Phase 0·1 gate를 로컬 수동 실행에만 의존하지 않기 위한 저장소 검사다.
# registry push, cloud credential과 배포는 포함하지 않는다(ADR-0009/ADR-0010).
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # PR branch의 push는 건너뛰고 PR 검사를 사용한다. 기본 branch의 직접 push는 검사한다.
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test

      # 생성 SDK가 현재 OpenAPI와 어긋나면 실패한다. 재생성 결과는 작업 트리에만 남는다.
      - run: pnpm openapi:check

      # Testcontainers가 runner의 Docker로 격리된 PostgreSQL을 만든다.
      - run: pnpm test:integration

      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: git diff --exit-code -- apps/web/tsconfig.json

      # app profile의 실제 이미지 + 임시 PostgreSQL + 로컬 HTTPS. 실제 계정·비밀값 불필요.
      - run: pnpm test:images

      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7
